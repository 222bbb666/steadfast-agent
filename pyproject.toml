[project]
name = "steadfast-agent"
version = "0.0.1"
description = "A write-gated agent runtime, distilled into a small model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steadfast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
