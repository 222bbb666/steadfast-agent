name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python 3.12 --locked
      - name: Tests
        run: uv run pytest -q
      - name: Split follows the frozen rules
        run: uv run python scripts/make_split.py --check
      - name: Runtime has no benchmark leakage
        run: uv run python scripts/check_leakage.py
      - name: Final-run log is intact
        run: uv run python -m evals.run_log verify
